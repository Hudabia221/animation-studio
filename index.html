<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation Studio - Character Voices</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 2rem;
      color: var(--text);
    }
    p {
      margin: 0;
      color: var(--subtext);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--subtext);
    }
    input, select, textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 1rem;
      box-sizing: border-box;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: var(--accent-hover);
    }
    .status {
      padding: 12px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Animation Studio</h1>
      <p>Create English & Urdu voice-overs effortlessly</p>
    </header>

    <!-- Character Manager Card -->
    <div class="card">
      <h3 style="margin:0; color:var(--text);">Manage Characters</h3>
      <div>
        <label for="newCharName">Character Name</label>
        <input type="text" id="newCharName" placeholder="e.g. Ali, Narrator">
      </div>
      <div>
        <label for="newCharVoiceId">ElevenLabs Voice ID</label>
        <input type="text" id="newCharVoiceId" placeholder="Paste Voice ID here (e.g. pNInz6obpgDQGcFmaJgB)">
      </div>
      <div style="display: flex; gap: 10px;">
        <button id="addCharBtn" style="background: #3b82f6; flex: 2;">Add New Character</button>
        <button id="resetCharsBtn" style="background: #ef4444; flex: 1;" title="Clears old default characters">Reset List</button>
      </div>
    </div>

    <!-- Main Generator Card -->
    <div class="card">
      <div>
        <label for="elevenKey">ElevenLabs API Key</label>
        <input type="password" id="elevenKey" placeholder="Paste your ElevenLabs key here">
      </div>

      <div>
        <label for="characterSelect">Select Character / Voice</label>
        <select id="characterSelect">
          <!-- Characters will appear here automatically -->
        </select>
      </div>

      <div>
        <label for="scriptInput">Script Line (Type in English or Urdu)</label>
        <textarea id="scriptInput" placeholder="Type what this character is saying (English or اردو)..."></textarea>
      </div>

      <button id="generateBtn">Generate Character Voice</button>
      <div id="statusBox" class="status"></div>
    </div>
  </div>

  <script>
    // Load characters or start fresh
    let characters = JSON.parse(localStorage.getItem('animation_chars')) || [];

    const characterSelect = document.getElementById('characterSelect');

    function updateDropdown() {
      characterSelect.innerHTML = '';
      if (characters.length === 0) {
        let opt = document.createElement('option');
        opt.textContent = 'No characters added yet. Add one above!';
        characterSelect.appendChild(opt);
        return;
      }
      characters.forEach(char => {
        let option = document.createElement('option');
        option.value = char.id;
        option.textContent = char.name;
        characterSelect.appendChild(option);
      });
    }

    updateDropdown();

    // Add new character
    document.getElementById('addCharBtn').addEventListener('click', () => {
      const name = document.getElementById('newCharName').value.trim();
      const voiceId = document.getElementById('newCharVoiceId').value.trim();

      if (!name || !voiceId) {
        alert('Please enter both a character name and a Voice ID.');
        return;
      }

      characters.push({ name: name, id: voiceId });
      localStorage.setItem('animation_chars', JSON.stringify(characters));
      
      updateDropdown();

      document.getElementById('newCharName').value = '';
      document.getElementById('newCharVoiceId').value = '';
      alert('Character added successfully!');
    });

    // Reset / Clear characters button
    document.getElementById('resetCharsBtn').addEventListener('click', () => {
      if (confirm('Are you sure you want to clear all saved characters?')) {
        characters = [];
        localStorage.removeItem('animation_chars');
        updateDropdown();
        alert('Character list cleared. Now you can add your own fresh characters!');
      }
    });

    // Generate audio script
    document.getElementById('generateBtn').addEventListener('click', async () => {
      const elevenKey = document.getElementById('elevenKey').value.trim();
      const selectedVoiceId = characterSelect.value;
      const scriptText = document.getElementById('scriptInput').value.trim();
      const status = document.getElementById('statusBox');

      status.style.display = 'block';

      if (!elevenKey || !scriptText || !selectedVoiceId || characters.length === 0) {
        status.style.color = '#f87171';
        status.textContent = 'Please add a character, select it from the dropdown, fill in your API key, and enter a script line.';
        return;
      }

      status.style.color = '#34d399';
      status.textContent = 'Processing... Generating audio via ElevenLabs.';

      try {
        const elevenResponse = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${selectedVoiceId}`, {
          method: 'POST',
          headers: {
            'Accept': 'audio/mpeg',
            'Content-Type': 'application/json',
            'xi-api-key': elevenKey
          },
          body: JSON.stringify({
            text: scriptText,
            model_id: 'eleven_multilingual_v2',
            voice_settings: { stability: 0.5, similarity_boost: 0.7 }
          })
        });

        if (!elevenResponse.ok) {
          const errData = await elevenResponse.json().catch(() => ({}));
          throw new Error(errData.detail?.message || 'Failed to generate audio. Check your Voice ID and API key.');
        }
        
        const audioBlob = await elevenResponse.blob();
        const audioUrl = URL.createObjectURL(audioBlob);

        status.style.color = '#34d399';
        status.innerHTML = `Success! Voice generated. <a href="${audioUrl}" target="_blank" style="color: #6366f1; font-weight: bold; margin-left: 10px;">Listen / Download Audio</a>`;

      } catch (error) {
        status.style.color = '#f87171';
        status.textContent = 'Error: ' + error.message;
      }
    });
  </script>
</body>
</html>
