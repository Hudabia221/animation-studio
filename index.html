<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation Studio</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 2rem;
      color: var(--text);
    }
    p {
      margin: 0;
      color: var(--subtext);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--subtext);
    }
    input, textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 1rem;
      box-sizing: border-box;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: var(--accent-hover);
    }
    .status {
      padding: 12px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Animation Studio</h1>
      <p>Generate audio and animation assets directly from your browser</p>
    </header>

    <div class="card">
      <div>
        <label for="elevenKey">ElevenLabs API Key</label>
        <input type="password" id="elevenKey" placeholder="Paste your ElevenLabs key here">
      </div>

      <div>
        <label for="heygenKey">HeyGen API Key</label>
        <input type="password" id="heygenKey" placeholder="Paste your HeyGen key here">
      </div>

      <div>
        <label for="scriptInput">Script / Prompt</label>
        <textarea id="scriptInput" placeholder="Type your script or animation prompt here..."></textarea>
      </div>

      <button id="generateBtn">Generate Assets</button>
      <div id="statusBox" class="status"></div>
    </div>
  </div>

  <script>
    document.getElementById('generateBtn').addEventListener('click', async () => {
      const elevenKey = document.getElementById('elevenKey').value.trim();
      const heygenKey = document.getElementById('heygenKey').value.trim();
      const scriptText = document.getElementById('scriptInput').value.trim();
      const status = document.getElementById('statusBox');

      status.style.display = 'block';

      if (!elevenKey || !heygenKey || !scriptText) {
        status.style.color = '#f87171';
        status.textContent = 'Please fill in both API keys and enter a script.';
        return;
      }

      status.style.color = '#34d399';
      status.textContent = 'Processing... Connecting to ElevenLabs and HeyGen APIs.';

      try {
        // 1. Call ElevenLabs API to generate audio
        /*
        const voiceId = 'YOUR_ELEVENLABS_VOICE_ID';
        const elevenResponse = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
          method: 'POST',
          headers: {
            'Accept': 'audio/mpeg',
            'Content-Type': 'application/json',
            'xi-api-key': elevenKey
          },
          body: JSON.stringify({
            text: scriptText,
            model_id: 'eleven_monolingual_v1',
            voice_settings: { stability: 0.5, similarity_boost: 0.5 }
          })
        });

        if (!elevenResponse.ok) throw new Error('Failed to generate audio from ElevenLabs.');
        const audioBlob = await elevenResponse.blob();
        */

        // 2. Call HeyGen API to generate video/animation assets
        /*
        const heygenResponse = await fetch('https://api.heygen.com/v2/video/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Api-Key': heygenKey
          },
          body: JSON.stringify({
            video_inputs: [{
              character: { type: 'avatar', avatar_id: 'YOUR_AVATAR_ID' },
              voice: { type: 'text', input_text: scriptText }
            }]
          })
        });

        if (!heygenResponse.ok) throw new Error('Failed to generate video from HeyGen.');
        const heygenData = await heygenResponse.json();
        */

        // Temporary confirmation until specific Voice IDs / Avatar IDs are added:
        setTimeout(() => {
          status.style.color = '#34d399';
          status.textContent = 'Success! API requests structured and ready.';
        }, 1500);

      } catch (error) {
        status.style.color = '#f87171';
        status.textContent = 'Error: ' + error.message;
      }
    });
  </script>
</body>
</html>
